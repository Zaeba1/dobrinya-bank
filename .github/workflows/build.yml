name: Build DOBRINYA BANK APK

on:
  push:
    branches: [main]
    paths:
      - "dobrinyabank_starter.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Searching entire SDK..."
            SDKMANAGER=$(find "$SDK" -type f -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK" -maxdepth 4 -type d | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract DOBRINYA BANK
        run: |
          ZIP="dobrinyabank_starter.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Archive not found: $ZIP"
            exit 1
          fi

          mkdir unpacked
          unzip -q -o "$ZIP" -d unpacked

          echo "Archive extracted"

      - name: Locate Android project
        run: |
          PROJECT=$(find unpacked -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            find unpacked -maxdepth 5 -type f | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$PROJECT")

          if [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Project: $ANDROID_DIR"

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOBRINYA-BANK-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
